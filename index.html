function FeeCalculator({ hasCompare }) {
  var [tvInch, setTvInch] = useState("32");
  var [stairs, setStairs] = useState("none");
  var [stairsFloor, setStairsFloor] = useState("2");
  var [tvSize, setTvSize] = useState("16up");
  var [recycleType, setRecycleType] = useState("hakobi");
  var [open, setOpen] = useState(false);

  /* 配送料（テレビサイズ別・キャンペーン反映） */
  var deliveryMap = {
    "32":  { fee: 2200,  label: "32型（3辺240cm以下・30kg以下）", campaign: false },
    "42":  { fee: 0,     label: "43型以上は配送料無料キャンペーン中", campaign: true },
    "51":  { fee: 0,     label: "43型以上は配送料無料キャンペーン中", campaign: true },
    "60":  { fee: 0,     label: "43型以上は配送料無料キャンペーン中", campaign: true },
    "69":  { fee: 0,     label: "43型以上は配送料無料キャンペーン中", campaign: true },
    "70up":{ fee: 0,     label: "43型以上は配送料無料キャンペーン中", campaign: true }
  };
  var delivery = deliveryMap[tvInch].fee;

  /* テレビ設置料（固定） */
  var install = 1100;

  /* 階段昇降料（内階段・外階段 × 階数） */
  var stairsInner = { "2": 3300, "3": 3300, "4": 4400, "5": 5500 };
  var stairsOuter = { "2": 0,    "3": 1100, "4": 2200, "5": 3300 };
  var stairsFee = stairs === "none" ? 0
    : stairs === "inner" ? stairsInner[stairsFloor]
    : stairsOuter[stairsFloor];

  /* リサイクル料 */
  var recycleMap = {
    hakobi: { "15under": 4620, "16up": 5720 },
    jitori: { "15under": 7370, "16up": 8470 },
    ec:     { "15under": 660,  "16up": 660  }
  };
  var recycle = recycleMap[recycleType][tvSize];

  var total = delivery + install + stairsFee + recycle;

  var tvOpts = [
    { k: "32",   l: "32型" },
    { k: "42",   l: "43型" },
    { k: "51",   l: "51型以下" },
    { k: "60",   l: "60型以下" },
    { k: "69",   l: "69型以下" },
    { k: "70up", l: "70型以上" }
  ];
  var stairsOpts = [
    { k: "none",  l: "なし / EV利用" },
    { k: "inner", l: "内階段" },
    { k: "outer", l: "外階段" }
  ];
  var floorOpts = ["2", "3", "4", "5"];
  var sizeOpts = [
    { k: "15under", l: "15型以下" },
    { k: "16up",    l: "16型以上" }
  ];
  var recycleOpts = [
    { k: "hakobi", l: "運び入れのみ" },
    { k: "jitori", l: "自取り（旧TV回収）" },
    { k: "ec",     l: "EC廃棄（+廃棄料）" }
  ];

  function selBtn(val, cur, setter, label) {
    var active = val === cur;
    return (
      <button key={val} onClick={function() { setter(val); }} style={{
        padding: "5px 11px", borderRadius: "6px", cursor: "pointer", fontSize: "11px",
        fontWeight: active ? "700" : "500",
        border: active ? "2px solid #1D4ED8" : "2px solid #E2E8F0",
        background: active ? "#EFF6FF" : "#F8FAFC",
        color: active ? "#1D4ED8" : "#64748B"
      }}>{label}</button>
    );
  }

  function row(label, value, sub, color) {
    return (
      <div style={{ background: "#fff", borderRadius: "8px", padding: "10px 13px", border: "1px solid #E2E8F0", marginBottom: "7px" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div style={{ fontSize: "12px", fontWeight: "800", color: "#1E293B" }}>{label}</div>
          <div style={{ fontSize: "18px", fontWeight: "800", color: color || (value === 0 ? "#059669" : "#1E293B") }}>
            {value === 0 ? "無料" : "¥" + value.toLocaleString()}
          </div>
        </div>
        {sub && (
          <div style={{ fontSize: "10px", color: "#94A3B8", marginTop: "4px", borderTop: "1px solid #F1F5F9", paddingTop: "4px" }}>{sub}</div>
        )}
      </div>
    );
  }

  return (
    <div style={{ background: "#fff", border: "1.5px solid #E2E8F0", borderRadius: "12px", overflow: "hidden", marginBottom: hasCompare ? "100px" : "0" }}>
      <button onClick={function() { setOpen(!open); }} style={{
        width: "100%", display: "flex", justifyContent: "space-between", alignItems: "center",
        padding: "12px 16px", background: "none", border: "none", cursor: "pointer"
      }}>
        <div style={{ display: "flex", alignItems: "center", gap: "8px" }}>
          <span style={{ fontSize: "16px" }}>🚚</span>
          <div style={{ textAlign: "left" }}>
            <div style={{ fontSize: "13px", fontWeight: "800", color: "#1E293B" }}>配送・設置・昇降・リサイクル料金シミュレーター</div>
            <div style={{ fontSize: "10px", color: "#94A3B8" }}>テレビのサイズ・設置環境を選んで合計費用を確認</div>
          </div>
        </div>
        <span style={{ fontSize: "16px", color: "#94A3B8" }}>{open ? "▲" : "▼"}</span>
      </button>

      {open && (
        <div style={{ padding: "0 16px 16px", borderTop: "1px solid #F1F5F9" }}>

          {/* テレビサイズ */}
          <div style={{ marginTop: "12px", marginBottom: "10px" }}>
            <div style={{ fontSize: "11px", fontWeight: "700", color: "#475569", marginBottom: "5px" }}>📺 購入するテレビのサイズ</div>
            <div style={{ display: "flex", gap: "5px", flexWrap: "wrap" }}>
              {tvOpts.map(function(o) { return selBtn(o.k, tvInch, setTvInch, o.l); })}
            </div>
            <div style={{ fontSize: "10px", color: "#94A3B8", marginTop: "4px" }}>{deliveryMap[tvInch].label}</div>
          </div>

          {/* 階段昇降 */}
          <div style={{ marginBottom: "10px" }}>
            <div style={{ fontSize: "11px", fontWeight: "700", color: "#475569", marginBottom: "5px" }}>🪜 階段昇降（配送・設置料とは別料金）</div>
            <div style={{ display: "flex", gap: "5px", flexWrap: "wrap", marginBottom: "6px" }}>
              {stairsOpts.map(function(o) { return selBtn(o.k, stairs, setStairs, o.l); })}
            </div>
            {stairs !== "none" && (
              <div>
                <div style={{ fontSize: "10px", color: "#64748B", marginBottom: "4px" }}>昇降する階数：</div>
                <div style={{ display: "flex", gap: "5px" }}>
                  {floorOpts.map(function(f) { return selBtn(f, stairsFloor, setStairsFloor, f + "階"); })}
                </div>
                <div style={{ fontSize: "10px", color: "#94A3B8", marginTop: "4px" }}>
                  {stairs === "inner"
                    ? "内階段：2階¥3,300 / 3階¥3,300 / 4階¥4,400 / 5階¥5,500"
                    : "外階段：2階無料 / 3階¥1,100 / 4階¥2,200 / 5階¥3,300"}
                </div>
              </div>
            )}
          </div>

          {/* リサイクル */}
          <div style={{ marginBottom: "14px" }}>
            <div style={{ fontSize: "11px", fontWeight: "700", color: "#475569", marginBottom: "5px" }}>♻️ 旧テレビのリサイクル</div>
            <div style={{ display: "flex", gap: "5px", flexWrap: "wrap", marginBottom: "6px" }}>
              {recycleOpts.map(function(o) { return selBtn(o.k, recycleType, setRecycleType, o.l); })}
            </div>
            <div style={{ display: "flex", gap: "5px" }}>
              {sizeOpts.map(function(o) { return selBtn(o.k, tvSize, setTvSize, o.l); })}
            </div>
            {recycleType === "ec" && (
              <div style={{ fontSize: "10px", color: "#DC2626", marginTop: "4px" }}>※別途メーカー廃棄料が加算されます</div>
            )}
          </div>

          {/* 内訳 */}
          <div style={{ background: "#F8FAFC", borderRadius: "10px", padding: "12px", border: "1.5px solid #E2E8F0" }}>
            {row("🚚 配送料",
              delivery,
              deliveryMap[tvInch].campaign
                ? "🎉 43型以上 配送料無料キャンペーン中！"
                : deliveryMap[tvInch].label,
              deliveryMap[tvInch].campaign ? "#059669" : undefined
            )}
            {row("🔧 テレビ設置料", install, "設置作業費（固定）")}
            {row("🪜 昇降料", stairsFee,
              stairs === "none" ? "なし / エレベーター利用" :
              (stairs === "inner" ? "内階段 " : "外階段 ") + stairsFloor + "階",
              stairsFee > 0 ? "#DC2626" : undefined
            )}
            {row("♻️ リサイクル料", recycle,
              (recycleType === "hakobi" ? "運び入れのみ" : recycleType === "jitori" ? "自取り（旧TV回収）" : "EC廃棄") +
              "（" + (tvSize === "15under" ? "15型以下" : "16型以上") + "）" +
              (recycleType === "ec" ? " ※廃棄料別途" : "")
            )}

            {/* 合計 */}
            <div style={{ background: "#1E3A5F", borderRadius: "8px", padding: "12px 14px" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "6px" }}>
                <div style={{ color: "rgba(255,255,255,0.75)", fontSize: "12px" }}>合計追加費用（目安）</div>
                <div style={{ color: "#fff", fontSize: "26px", fontWeight: "800" }}>¥{total.toLocaleString()}</div>
              </div>
              {recycleType === "ec" && (
                <div style={{ color: "#FCA5A5", fontSize: "10px", textAlign: "right", marginBottom: "5px" }}>※ メーカー廃棄料は含まれていません</div>
              )}
              <div style={{ display: "flex", gap: "4px", flexWrap: "wrap" }}>
                {[
                  { l: "配送", v: delivery },
                  { l: "設置", v: install },
                  { l: "昇降", v: stairsFee },
                  { l: "リサイクル", v: recycle }
                ].map(function(x) { return (
                  <div key={x.l} style={{ background: "rgba(255,255,255,0.12)", borderRadius: "5px", padding: "3px 8px", fontSize: "10px", color: "rgba(255,255,255,0.85)" }}>
                    {x.l}：{x.v === 0 ? "無料" : "¥" + x.v.toLocaleString()}
                  </div>
                ); })}
              </div>
            </div>

            <div style={{ marginTop: "8px", display: "grid", gridTemplateColumns: "1fr 1fr", gap: "6px" }}>
              <div style={{ padding: "8px 10px", background: "#EFF6FF", borderRadius: "6px", fontSize: "10px", color: "#1E40AF" }}>
                <span style={{ fontWeight: "700" }}>長期保証（5年）</span><br />ポイント5%利用で加入可
              </div>
              <div style={{ padding: "8px 10px", background: "#FFF7ED", borderRadius: "6px", fontSize: "10px", color: "#92400E" }}>
                <span style={{ fontWeight: "700" }}>テレビ台組み立て</span><br />別途 ¥1,100
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );

}
function bestResolution(arr) {
  if (arr.some(function(t) { return t.resolution === "4K"; })) return arr.filter(function(t) { return t.resolution === "4K"; }).map(function(t) { return t.id; });
  if (arr.some(function(t) { return t.resolution === "FHD"; })) return arr.filter(function(t) { return t.resolution === "FHD"; }).map(function(t) { return t.id; });
  return [];
}
function bestFrameRate(arr) {
  var max = arr.reduce(function(m, t) { var v = parseInt(t.specs.frameRate); return v > m ? v : m; }, 0);
  return arr.filter(function(t) { return parseInt(t.specs.frameRate) === max; }).map(function(t) { return t.id; });
}
function bestHdmi(arr) {
  var mx = arr.reduce(function(m, t) { return t.specs.hdmi > m ? t.specs.hdmi : m; }, 0);
  return arr.filter(function(t) { return t.specs.hdmi === mx; }).map(function(t) { return t.id; });
}
function bestUsb(arr) {
  var mx = arr.reduce(function(m, t) { return t.specs.usb > m ? t.specs.usb : m; }, 0);
  return arr.filter(function(t) { return t.specs.usb === mx; }).map(function(t) { return t.id; });
}
function bestSpeaker(arr) {
  var mx = arr.reduce(function(m, t) { var v = parseInt(t.specs.speaker) || 0; return v > m ? v : m; }, 0);
  if (mx === 0) return [];
  return arr.filter(function(t) { return (parseInt(t.specs.speaker) || 0) === mx; }).map(function(t) { return t.id; });
}
function bestEco(arr) {
  var mx = arr.reduce(function(m, t) { return t.specs.ecoStar > m ? t.specs.ecoStar : m; }, 0);
  if (mx === 0) return [];
  return arr.filter(function(t) { return t.specs.ecoStar === mx; }).map(function(t) { return t.id; });
}
function bestAnnualCost(arr) {
  var vals = arr.filter(function(t) { return t.specs.annualCost !== "—"; }).map(function(t) { return { id: t.id, v: parseInt(t.specs.annualCost) }; });
  if (vals.length === 0) return [];
  var mn = vals.reduce(function(m, v) { return v.v < m ? v.v : m; }, vals[0].v);
  return vals.filter(function(v) { return v.v === mn; }).map(function(v) { return v.id; });
}

function TVGuide() {
  const [sizeFilter,    setSizeFilter]    = useState("すべて");
  const [brandFilters,  setBrandFilters]  = useState(new Set());
  const [featureFilters,setFeatureFilters]= useState(new Set());
  const [sort,          setSort]          = useState("price");
  const [openId,        setOpenId]        = useState(null);
  const [comparing,     setComparing]     = useState([]);
  const [showModal,     setShowModal]     = useState(false);

  function toggleBrand(b) {
    setBrandFilters(function(prev) {
      var next = new Set(prev);
      next.has(b) ? next.delete(b) : next.add(b);
      return next;
    });
  }
  function toggleFeature(k) {
    setFeatureFilters(function(prev) {
      var next = new Set(prev);
      next.has(k) ? next.delete(k) : next.add(k);
      return next;
    });
  }
  function clearAll() { setBrandFilters(new Set()); setFeatureFilters(new Set()); setSizeFilter("すべて"); }

  var filtered = allTvData.filter(function(tv) {
    if (sizeFilter === "32型" && tv.size !== 32) return false;
    if (sizeFilter === "43型" && (tv.size < 40 || tv.size >= 45)) return false;
    if (sizeFilter === "50型" && (tv.size < 45 || tv.size >= 53)) return false;
    if (sizeFilter === "55型" && (tv.size < 53 || tv.size >= 60)) return false;
    if (sizeFilter === "65型" && (tv.size < 60 || tv.size >= 70)) return false;
    if (sizeFilter === "75型以上" && tv.size < 70) return false;
    if (brandFilters.size > 0 && !brandFilters.has(tv.brand)) return false;
    if (featureFilters.size > 0) {
      var checks = {
        googleTV:    tv.googleTV,
        airplay:     tv.airplay,
        doubleSpeed: tv.doubleSpeed,
        twoScreen:   tv.twoScreen,
        netVideo:    tv.netVideo,
        oled:        tv.type.includes("有機EL"),
        miniLED:     tv.type.includes("miniLED") || tv.type.includes("MiniLED"),
        bdDrive:     tv.bdDrive
      };
      var featureArr = Array.from(featureFilters);
      for (var fi = 0; fi < featureArr.length; fi++) { if (!checks[featureArr[fi]]) return false; }
    }
    return true;
  });

  var sorted = filtered.slice().sort(function(a, b) {
    if (sort === "priceDesc") return b.price - a.price;
    return a.price - b.price;
  });

  function toggleCompare(id) {
    setComparing(function(prev) {
      if (prev.includes(id)) return prev.filter(function(x) { return x !== id; });
      if (prev.length < 3) return prev.concat([id]);
      return prev;
    });
  }

  var compareList = allTvData.filter(function(t) { return comparing.includes(t.id); });
  var priceArr = filtered.length > 0 ? filtered.map(function(t){ return t.price; }) : [0];
  var minPrice = Math.min.apply(null, priceArr);

  function brandColor(b) { return BRAND_COLORS[b] || "#64748B"; }

  var activeCount = brandFilters.size + featureFilters.size + (sizeFilter !== "すべて" ? 1 : 0);

    <div style={{ minHeight: "100vh", background: "#F1F5F9", fontFamily: "Hiragino Sans", color: "#1E293B" }}>

      {/* ── Header ── */}
      <div style={{ background: "linear-gradient(135deg, #0F2545 0%, #1E3A5F 100%)", padding: "16px 18px 14px", color: "#fff" }}>
        <div style={{ maxWidth: "1020px", margin: "0 auto" }}>

            <div>
              <div style={{ fontSize: "18px", fontWeight: "800" }}>テレビ 選び方ガイド</div>
              <div style={{ fontSize: "11px", color: "rgba(255,255,255,0.5)" }}>ビックカメラ川崎店 ／ 2026年5月 ／ 全{allTvData.length}機種掲載</div>
            </div>
          </div>
          <div style={{ background: "rgba(255,255,255,0.1)", borderRadius: "8px", padding: "8px 12px", fontSize: "11px", color: "rgba(255,255,255,0.8)", marginTop: "8px", borderLeft: "3px solid #FBBF24" }}>
            💬 <strong>スタッフより：</strong>メーカー・機能は複数選択できます。「＋比較」で最大3機種を横並び比較できます！
          </div>
        </div>
      </div>

      <div style={{ maxWidth: "1020px", margin: "0 auto", padding: "14px 12px" }}>

        }}>
          <div style={{ maxWidth: "1020px", margin: "0 auto", display: "flex", alignItems: "center", gap: "10px", flexWrap: "wrap" }}>
            <div style={{ color: "rgba(255,255,255,0.55)", fontSize: "11px", whiteSpace: "nowrap" }}>比較中 {comparing.length}/3</div>
            <div style={{ display: "flex", gap: "7px", flex: 1, flexWrap: "wrap" }}>
              {compareList.map(function(tv) { return (
                <div key={tv.id} style={{
                  display: "flex", alignItems: "center", gap: "6px",
                  background: "rgba(255,255,255,0.08)", borderRadius: "8px",
                  padding: "5px 10px", border: "1.5px solid rgba(255,255,255,0.15)"
                }}>
                  <div style={{ width: "8px", height: "8px", borderRadius: "50%", background: brandColor(tv.brand), flexShrink: 0 }} />
                  <div>
                    <div style={{ color: brandColor(tv.brand), fontSize: "9px", fontWeight: "700" }}>{tv.brand}</div>
                    <div style={{ color: "#fff", fontSize: "11px", fontWeight: "800" }}>{tv.model}</div>
                  </div>
                  <button onClick={function(){ toggleCompare(tv.id); }} style={{ background: "none", border: "none", color: "rgba(255,255,255,0.4)", cursor: "pointer", fontSize: "14px", lineHeight: 1, padding: "0 2px", marginLeft: "2px" }}>×</button>
                </div>
              ); })}
              {Array.apply(null, Array(3 - comparing.length)).map(function(_, i) { return (
                <div key={i} style={{
                  display: "flex", alignItems: "center", justifyContent: "center",
                  background: "rgba(255,255,255,0.04)", borderRadius: "8px",
                  padding: "5px 14px", border: "1.5px dashed rgba(255,255,255,0.12)",
                  color: "rgba(255,255,255,0.2)", fontSize: "10px"
                }}>+ 追加</div>
              ); })}
            </div>
            <div style={{ display: "flex", gap: "6px" }}>
              <button onClick={function(){ setComparing([]); }} style={{ padding: "7px 13px", borderRadius: "7px", cursor: "pointer", fontSize: "11px", fontWeight: "700", border: "1.5px solid rgba(255,255,255,0.2)", background: "transparent", color: "rgba(255,255,255,0.55)" }}>クリア</button>
              <button onClick={function(){ setShowModal(true); }} disabled={comparing.length < 2} style={{
                padding: "7px 16px", borderRadius: "7px", cursor: comparing.length >= 2 ? "pointer" : "not-allowed",
                fontSize: "12px", fontWeight: "800", border: "none",
                background: comparing.length >= 2 ? "#3B82F6" : "rgba(255,255,255,0.1)",
                color: comparing.length >= 2 ? "#fff" : "rgba(255,255,255,0.3)"
              }}>📊 比較する{comparing.length < 2 ? "（2機種以上）" : ""}</button>
            </div>
          </div>
        </div>
      )}

      {/* ── Compare Modal ── */}
      {showModal && compareList.length >= 2 && (
        <div style={{ position: "fixed", inset: 0, zIndex: 200, background: "rgba(0,0,0,0.72)", display: "flex", alignItems: "center", justifyContent: "center", padding: "10px" }}
          onClick={function(e){ if (e.target === e.currentTarget) setShowModal(false); }}>
          <div style={{ background: "#fff", borderRadius: "16px", width: "100%", maxWidth: "920px", maxHeight: "92vh", overflow: "hidden", display: "flex", flexDirection: "column", boxShadow: "0 24px 60px rgba(0,0,0,0.45)" }}>

            {/* Modal header */}
            <div style={{ background: "#0F2545", padding: "14px 20px", display: "flex", justifyContent: "space-between", alignItems: "center", flexShrink: 0 }}>
              <span style={{ color: "#fff", fontWeight: "800", fontSize: "15px" }}>📊 比較表 — {compareList.length}機種</span>
              <button onClick={function(){ setShowModal(false); }} style={{ background: "rgba(255,255,255,0.15)", border: "none", color: "#fff", width: "30px", height: "30px", borderRadius: "50%", cursor: "pointer", fontSize: "16px", fontWeight: "700" }}>×</button>
            </div>

            {/* Modal body */}
            <div style={{ overflowY: "auto", flex: 1 }}>
              <div style={{ overflowX: "auto" }}>
                <table style={{ width: "100%", borderCollapse: "collapse", fontSize: "12px", minWidth: "460px" }}>
                  <thead>
                    <tr style={{ background: "#F8FAFC", borderBottom: "2px solid #E2E8F0" }}>
                      <td style={{ padding: "14px 18px", color: "#64748B", fontSize: "11px", fontWeight: "700", width: "110px" }}>項目</td>
                      {compareList.map(function(tv) {
                        var bc = brandColor(tv.brand);
                        return (
                          <td key={tv.id} style={{ padding: "12px 14px", textAlign: "center", borderLeft: "2px solid #E2E8F0" }}>
                            <div style={{ width: "100%", height: "3px", borderRadius: "2px", background: bc, marginBottom: "6px" }} />
                            <div style={{ fontSize: "12px", fontWeight: "800", color: bc }}>{tv.brand}</div>
                            <div style={{ fontWeight: "800", color: "#1E293B", fontSize: "14px", marginTop: "1px" }}>{tv.model}</div>
                            <div style={{ fontSize: "10px", background: bc + "15", color: bc, borderRadius: "10px", padding: "1px 7px", display: "inline-block", marginTop: "4px", fontWeight: "700" }}>{tv.size}型 / {tv.type}</div>
                          </td>
                        );
                      })}
                    </tr>
                  </thead>
                  <tbody>
                    {/* 価格 */}
                    <tr style={{ background: "#EFF6FF" }}>
                      <td colSpan={compareList.length + 1} style={{ padding: "5px 18px", fontSize: "10px", fontWeight: "800", color: "#1E40AF" }}>💴 価格</td>
                    </tr>
                    {[
                      { l: "税込価格", fn: function(tv) { return "¥" + fmt(tv.price); }, bestFn: function(arr) { return [arr.reduce(function(m,t) { return t.price < m.price ? t : m; }).id]; }, big: true }
                    ].map(function(row) { return (
                      <tr key={row.l} style={{ background: "#fff", borderBottom: "1px solid #F1F5F9" }}>
                        <td style={{ padding: "10px 18px", color: "#64748B", fontSize: "11px", fontWeight: "600", borderRight: "1px solid #F1F5F9" }}>{row.l}</td>
                        {compareList.map(function(tv) {
                          var isBest = row.bestFn(compareList).includes(tv.id);
                          return (
                            <td key={tv.id} style={{ padding: "10px 14px", textAlign: "center", borderLeft: "1px solid #F1F5F9", background: isBest ? "#F0FDF4" : "transparent" }}>
                              <div style={{ fontWeight: isBest?"800":"500", color: isBest?"#166534":"#334155", fontSize: "16px" }}>{row.fn(tv)}</div>
                              {isBest && <div style={{ fontSize: "9px", color: "#059669", fontWeight: "700" }}>◀ 最安</div>}
                            </td>
                          );
                        })}
                      </tr>
                    ); })}

                    {/* 画質・パネル */}
                    <tr style={{ background: "#FFF7ED" }}>
                      <td colSpan={compareList.length + 1} style={{ padding: "5px 18px", fontSize: "10px", fontWeight: "800", color: "#C2410C" }}>🖼️ 画質・パネル</td>
                    </tr>
                    {[
                      { l: "パネル種類", fn: function(tv) { return tv.type; } },
                      { l: "パネル詳細", fn: function(tv) { return tv.panel; } },
                      { l: "解像度", fn: resolutionLabel, bestFn: bestResolution },
                      { l: "フレームレート", fn: function(tv) { return tv.specs.frameRate; }, bestFn: bestFrameRate },
                      { l: "倍速表示", fn: function(tv) { return tv.doubleSpeed ? "✓ 対応" : "—"; }, bool: true, bestFn: function(arr) { return arr.filter(function(t) { return t.doubleSpeed; }).map(function(t) { return t.id; }); } }
                    ].map(function(row, ri) { return (
                      <tr key={row.l} style={{ background: ri%2===0?"#fff":"#FFFBF5", borderBottom: "1px solid #F1F5F9" }}>
                        <td style={{ padding: "10px 18px", color: "#64748B", fontSize: "11px", fontWeight: "600", borderRight: "1px solid #F1F5F9" }}>{row.l}</td>
                        {compareList.map(function(tv) {
                          var best = row.bestFn ? row.bestFn(compareList) : [];
                          var isBest = best.includes(tv.id);
                          var val = row.fn(tv);
                          return (
                            <td key={tv.id} style={{ padding: "10px 14px", textAlign: "center", borderLeft: "1px solid #F1F5F9", background: isBest?"#FFF7ED":"transparent" }}>
                              <span style={{ fontWeight: isBest?"800":"400", color: row.bool?(val.includes("✓")?"#059669":"#CBD5E1"):isBest?"#C2410C":"#334155", fontSize: "12px" }}>{val}</span>
                              {isBest && !row.bool && <div style={{ fontSize: "9px", color: "#C2410C", fontWeight: "700" }}>◀ 優秀</div>}
                            </td>
                          );
                        })}
                      </tr>
                    ); })}

                    {/* 接続・端子 */}
                    <tr style={{ background: "#F5F3FF" }}>
                      <td colSpan={compareList.length + 1} style={{ padding: "5px 18px", fontSize: "10px", fontWeight: "800", color: "#5B21B6" }}>🔌 接続・端子</td>
                    </tr>
                    {[
                      { l: "チューナー", fn: function(tv) { return tv.specs.tuner; } },
                      { l: "HDMI端子", fn: function(tv) { return tv.specs.hdmi + "端子（ARC×" + tv.specs.hdmiArc + "）"; }, bestFn: bestHdmi },
                      { l: "USB端子", fn: function(tv) { return tv.specs.usb + "端子"; }, bestFn: bestUsb },
                      { l: "Wi-Fi", fn: function(tv) { return tv.specs.wifi ? "✓ 内蔵" : "— なし"; }, bool: true, bestFn: function(arr) { return arr.filter(function(t) { return t.specs.wifi; }).map(function(t) { return t.id; }); } },
                      { l: "Bluetooth", fn: function(tv) { return tv.specs.bluetooth ? "✓ 内蔵" : "— なし"; }, bool: true, bestFn: function(arr) { return arr.filter(function(t) { return t.specs.bluetooth; }).map(function(t) { return t.id; }); } }
                    ].map(function(row, ri) { return (
                      <tr key={row.l} style={{ background: ri%2===0?"#fff":"#FAF9FF", borderBottom: "1px solid #F1F5F9" }}>
                        <td style={{ padding: "10px 18px", color: "#64748B", fontSize: "11px", fontWeight: "600", borderRight: "1px solid #F1F5F9" }}>{row.l}</td>
                        {compareList.map(function(tv) {
                          var best = row.bestFn ? row.bestFn(compareList) : [];
                          var isBest = best.includes(tv.id);
                          var val = row.fn(tv);
                          return (
                            <td key={tv.id} style={{ padding: "10px 14px", textAlign: "center", borderLeft: "1px solid #F1F5F9", background: isBest?"#F5F3FF":"transparent" }}>
                              <span style={{ fontWeight: isBest?"800":"400", color: row.bool?(val.includes("✓")?"#059669":"#CBD5E1"):isBest?"#5B21B6":"#334155", fontSize: "12px" }}>{val}</span>
                              {isBest && !row.bool && <div style={{ fontSize: "9px", color: "#5B21B6", fontWeight: "700" }}>◀ 最多</div>}
                            </td>
                          );
                        })}
                      </tr>
                    ); })}

                    {/* スマート機能 */}
                    <tr style={{ background: "#F0FDF4" }}>
                      <td colSpan={compareList.length + 1} style={{ padding: "5px 18px", fontSize: "10px", fontWeight: "800", color: "#166534" }}>📱 スマート・配信機能</td>
                    </tr>
                    {[
                      { l: "Google TV", fn: function(tv) { return tv.googleTV ? "✓" : "—"; }, bool: true, bestFn: function(arr) { return arr.filter(function(t) { return t.googleTV; }).map(function(t) { return t.id; }); } },
                      { l: "AirPlay 2", fn: function(tv) { return tv.airplay ? "✓" : "—"; }, bool: true, bestFn: function(arr) { return arr.filter(function(t) { return t.airplay; }).map(function(t) { return t.id; }); } },
                      { l: "ネット動画", fn: function(tv) { return tv.netVideo ? "✓" : "—"; }, bool: true, bestFn: function(arr) { return arr.filter(function(t) { return t.netVideo; }).map(function(t) { return t.id; }); } }
                    ].map(function(row, ri) { return (
                      <tr key={row.l} style={{ background: ri%2===0?"#fff":"#F9FEF9", borderBottom: "1px solid #F1F5F9" }}>
                        <td style={{ padding: "10px 18px", color: "#64748B", fontSize: "11px", fontWeight: "600", borderRight: "1px solid #F1F5F9" }}>{row.l}</td>
                        {compareList.map(function(tv) {
                          var isBest = row.bestFn(compareList).includes(tv.id);
                          var val = row.fn(tv);
                          return (
                            <td key={tv.id} style={{ padding: "10px 14px", textAlign: "center", borderLeft: "1px solid #F1F5F9", background: isBest?"#F0FDF4":"transparent" }}>
                              <span style={{ fontSize: "15px", color: val==="✓"?"#059669":"#CBD5E1", fontWeight: "800" }}>{val}</span>
                            </td>
                          );
                        })}
                      </tr>
                    ); })}

                    {/* 音響・その他機能 */}
                    <tr style={{ background: "#FEF2F2" }}>
                      <td colSpan={compareList.length + 1} style={{ padding: "5px 18px", fontSize: "10px", fontWeight: "800", color: "#991B1B" }}>🔊 音響・その他機能</td>
                    </tr>
                    {[
                      { l: "スピーカー", fn: function(tv) { return tv.specs.speaker || "—"; }, bestFn: bestSpeaker },
                      { l: "2画面表示", fn: function(tv) { return tv.twoScreen ? "✓" : "—"; }, bool: true, bestFn: function(arr) { return arr.filter(function(t) { return t.twoScreen; }).map(function(t) { return t.id; }); } },
                      { l: "BD内蔵", fn: function(tv) { return tv.bdDrive ? "✓" : "—"; }, bool: true, bestFn: function(arr) { return arr.filter(function(t) { return t.bdDrive; }).map(function(t) { return t.id; }); } }
                    ].map(function(row, ri) { return (
                      <tr key={row.l} style={{ background: ri%2===0?"#fff":"#FFF5F5", borderBottom: "1px solid #F1F5F9" }}>
                        <td style={{ padding: "10px 18px", color: "#64748B", fontSize: "11px", fontWeight: "600", borderRight: "1px solid #F1F5F9" }}>{row.l}</td>
                        {compareList.map(function(tv) {
                          var best = row.bestFn ? row.bestFn(compareList) : [];
                          var isBest = best.includes(tv.id);
                          var val = row.fn(tv);
                          return (
                            <td key={tv.id} style={{ padding: "10px 14px", textAlign: "center", borderLeft: "1px solid #F1F5F9", background: isBest?"#FEF2F2":"transparent" }}>
                              <span style={{ fontWeight: isBest?"800":"400", color: row.bool?(val==="✓"?"#059669":"#CBD5E1"):isBest?"#991B1B":"#334155", fontSize: "12px" }}>{val}</span>
                              {isBest && !row.bool && <div style={{ fontSize: "9px", color: "#991B1B", fontWeight: "700" }}>◀ 最大</div>}
                            </td>
                          );
                        })}
                      </tr>
                    ); })}

                    {/* 省エネ */}
                    <tr style={{ background: "#ECFDF5" }}>
                      <td colSpan={compareList.length + 1} style={{ padding: "5px 18px", fontSize: "10px", fontWeight: "800", color: "#065F46" }}>🌿 省エネ</td>
                    </tr>
                    {[
                      { l: "省エネ評価", fn: function(tv) { return tv.specs.ecoStar > 0 ? tv.specs.ecoStar + " / 5.0" : "—"; }, bestFn: bestEco },
                      { l: "年間電気代", fn: function(tv) { return tv.specs.annualCost !== "—" ? tv.specs.annualCost : "—"; }, bestFn: bestAnnualCost }
                    ].map(function(row, ri) { return (
                      <tr key={row.l} style={{ background: ri%2===0?"#fff":"#F0FDF9", borderBottom: "1px solid #F1F5F9" }}>
                        <td style={{ padding: "10px 18px", color: "#64748B", fontSize: "11px", fontWeight: "600", borderRight: "1px solid #F1F5F9" }}>{row.l}</td>
                        {compareList.map(function(tv) {
                          var best = row.bestFn(compareList);
                          var isBest = best.includes(tv.id);
                          return (
                            <td key={tv.id} style={{ padding: "10px 14px", textAlign: "center", borderLeft: "1px solid #F1F5F9", background: isBest?"#ECFDF5":"transparent" }}>
                              <span style={{ fontWeight: isBest?"800":"400", color: isBest?"#065F46":"#334155", fontSize: "12px" }}>{row.fn(tv)}</span>
                              {isBest && <div style={{ fontSize: "9px", color: "#059669", fontWeight: "700" }}>◀ 優秀</div>}
                            </td>
                          );
                        })}
                      </tr>
                    ); })}

                    {/* 録画・配信 */}
                    <tr style={{ background: "#F0FDF4" }}>
                      <td colSpan={compareList.length + 1} style={{ padding: "5px 18px", fontSize: "10px", fontWeight: "800", color: "#166534" }}>📼 録画・配信</td>
                    </tr>
                    {[
                      { l: "録画機能", fn: function(tv) { return tv.recording.detail; } },
                      { l: "タイムシフト録画", fn: function(tv) { return tv.recording.timeshift ? "✓ 対応" : "—"; }, bool: true, bestFn: function(arr) { return arr.filter(function(t) { return t.recording.timeshift; }).map(function(t) { return t.id; }); } },
                      { l: "裏番組録画", fn: function(tv) { return tv.recording.simultaneous ? "✓ 対応" : "—"; }, bool: true, bestFn: function(arr) { return arr.filter(function(t) { return t.recording.simultaneous; }).map(function(t) { return t.id; }); } },
                      { l: "対応配信数", fn: function(tv) { return tv.streaming.length > 0 ? tv.streaming.length + "サービス" : "非対応"; }, bestFn: function(arr) { var mx = arr.reduce(function(m,t) { return t.streaming.length > m ? t.streaming.length : m; }, 0); if(mx===0) return []; return arr.filter(function(t) { return t.streaming.length === mx; }).map(function(t) { return t.id; }); } },
                      { l: "対応配信サービス", fn: function(tv) { return tv.streaming.length > 0 ? tv.streaming.join(" / ") : "—"; } }
                    ].map(function(row, ri) { return (
                      <tr key={row.l} style={{ background: ri%2===0?"#fff":"#F9FEF9", borderBottom: "1px solid #F1F5F9" }}>
                        <td style={{ padding: "10px 18px", color: "#64748B", fontSize: "11px", fontWeight: "600", borderRight: "1px solid #F1F5F9", whiteSpace: "nowrap" }}>{row.l}</td>
                        {compareList.map(function(tv) {
                          var best = row.bestFn ? row.bestFn(compareList) : [];
                          var isBest = best.includes(tv.id);
                          var val = row.fn(tv);
                          return (
                            <td key={tv.id} style={{ padding: "10px 14px", textAlign: "center", borderLeft: "1px solid #F1F5F9", background: isBest?"#F0FDF4":"transparent" }}>
                              <span style={{ fontWeight: isBest?"800":"400", fontSize: "11px", color: row.bool?(val.includes("✓")?"#059669":"#CBD5E1"):isBest?"#166534":"#334155" }}>{val}</span>
                              {isBest && !row.bool && <div style={{ fontSize: "9px", color: "#166534", fontWeight: "700" }}>◀ 最多</div>}
                            </td>
                          );
                        })}
                      </tr>
                    ); })}

                    {/* スタッフ */}
                    <tr style={{ background: "#EFF6FF" }}>
                      <td colSpan={compareList.length + 1} style={{ padding: "5px 18px", fontSize: "10px", fontWeight: "800", color: "#1E40AF" }}>💬 スタッフコメント</td>
                    </tr>
                    <tr style={{ background: "#fff" }}>
                      <td style={{ padding: "10px 18px", color: "#64748B", fontSize: "11px", fontWeight: "600", borderRight: "1px solid #F1F5F9", verticalAlign: "top" }}>特徴</td>
                      {compareList.map(function(tv) { return (
                        <td key={tv.id} style={{ padding: "10px 14px", borderLeft: "1px solid #F1F5F9", verticalAlign: "top" }}>
                          <div style={{ fontSize: "11px", color: "#374151", lineHeight: "1.6" }}>{tv.staffComment}</div>
                        </td>
                      ); })}
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>

            {/* Modal footer */}
            <div style={{ padding: "11px 20px", borderTop: "1px solid #E2E8F0", background: "#F8FAFC", display: "flex", justifyContent: "space-between", alignItems: "center", flexShrink: 0 }}>
              <button onClick={function(){ setComparing([]); setShowModal(false); }} style={{ background: "none", border: "1.5px solid #CBD5E1", color: "#64748B", padding: "7px 15px", borderRadius: "7px", cursor: "pointer", fontSize: "12px", fontWeight: "700" }}>選択をクリア</button>
              <button onClick={function(){ setShowModal(false); }} style={{ background: "#1D4ED8", border: "none", color: "#fff", padding: "7px 20px", borderRadius: "7px", cursor: "pointer", fontSize: "12px", fontWeight: "800" }}>閉じる</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(TVGuide));
  </script>
</body>
</html>
