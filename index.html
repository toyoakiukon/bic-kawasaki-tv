function resolutionLabel(tv) {
  if (tv.resolution === "FHD") return "フルHD (1920x1080)";
  if (tv.resolution === "HD") return "HD (1366x768)";
  return "4K (3840x2160)";
}
function bestResolution(arr) {
  if (arr.some(function(t) { return t.resolution === "4K"; })) return arr.filter(function(t) { return t.resolution === "4K"; }).map(function(t) { return t.id; });
  if (arr.some(function(t) { return t.resolution === "FHD"; })) return arr.filter(function(t) { return t.resolution === "FHD"; }).map(function(t) { return t.id; });
  return [];
}
function bestFrameRate(arr) {
  var max = arr.reduce(function(m, t) { var v = parseInt(t.specs.frameRate); return v > m ? v : m; }, 0);
  return arr.filter(function(t) { return parseInt(t.specs.frameRate) === max; }).map(function(t) { return t.id; });
}
function bestHdmi(arr) {
  var mx = arr.reduce(function(m, t) { return t.specs.hdmi > m ? t.specs.hdmi : m; }, 0);
  return arr.filter(function(t) { return t.specs.hdmi === mx; }).map(function(t) { return t.id; });
}
function bestUsb(arr) {
  var mx = arr.reduce(function(m, t) { return t.specs.usb > m ? t.specs.usb : m; }, 0);
  return arr.filter(function(t) { return t.specs.usb === mx; }).map(function(t) { return t.id; });
}
function bestSpeaker(arr) {
  var mx = arr.reduce(function(m, t) { var v = parseInt(t.specs.speaker) || 0; return v > m ? v : m; }, 0);
  if (mx === 0) return [];
  return arr.filter(function(t) { return (parseInt(t.specs.speaker) || 0) === mx; }).map(function(t) { return t.id; });
}
function bestEco(arr) {
  var mx = arr.reduce(function(m, t) { return t.specs.ecoStar > m ? t.specs.ecoStar : m; }, 0);
  if (mx === 0) return [];
  return arr.filter(function(t) { return t.specs.ecoStar === mx; }).map(function(t) { return t.id; });
}
function bestAnnualCost(arr) {
  var vals = arr.filter(function(t) { return t.specs.annualCost !== "—"; }).map(function(t) { return { id: t.id, v: parseInt(t.specs.annualCost) }; });
  if (vals.length === 0) return [];
  var mn = vals.reduce(function(m, v) { return v.v < m ? v.v : m; }, vals[0].v);
  return vals.filter(function(v) { return v.v === mn; }).map(function(v) { return v.id; });
}

function TVGuide() {
  const [sizeFilter,    setSizeFilter]    = useState("すべて");
  const [brandFilters,  setBrandFilters]  = useState(new Set());
  const [featureFilters,setFeatureFilters]= useState(new Set());
  const [sort,          setSort]          = useState("price");
  const [openId,        setOpenId]        = useState(null);
  const [comparing,     setComparing]     = useState([]);
  const [showModal,     setShowModal]     = useState(false);

  function toggleBrand(b) {
    setBrandFilters(function(prev) {
      var next = new Set(prev);
      next.has(b) ? next.delete(b) : next.add(b);
      return next;
    });
  }
  function toggleFeature(k) {
    setFeatureFilters(function(prev) {
      var next = new Set(prev);
      next.has(k) ? next.delete(k) : next.add(k);
      return next;
    });
  }
  function clearAll() { setBrandFilters(new Set()); setFeatureFilters(new Set()); setSizeFilter("すべて"); }

  var filtered = allTvData.filter(function(tv) {
    if (sizeFilter === "32型" && tv.size !== 32) return false;
    if (sizeFilter === "43型" && tv.size < 40 && tv.size !== 43) return false;
    if (sizeFilter === "43型" && tv.size >= 45) return false;
    if (sizeFilter === "50型以上" && tv.size < 45) return false;
    if (brandFilters.size > 0 && !brandFilters.has(tv.brand)) return false;
    if (featureFilters.size > 0) {
      var checks = {
        googleTV:    tv.googleTV,
        airplay:     tv.airplay,
        doubleSpeed: tv.doubleSpeed,
        twoScreen:   tv.twoScreen,
        netVideo:    tv.netVideo,
        oled:        tv.type.includes("有機EL"),
        miniLED:     tv.type.includes("miniLED"),
        bdDrive:     tv.bdDrive
      };
      var featureArr = Array.from(featureFilters);
      for (var fi = 0; fi < featureArr.length; fi++) { if (!checks[featureArr[fi]]) return false; }
    }
    return true;
  });

  var sorted = filtered.slice().sort(function(a, b) {
    if (sort === "priceDesc") return b.price - a.price;
    return a.price - b.price;
  });

  function toggleCompare(id) {
    setComparing(function(prev) {
      if (prev.includes(id)) return prev.filter(function(x) { return x !== id; });
      if (prev.length < 3) return prev.concat([id]);
      return prev;
    });
  }

  var compareList = allTvData.filter(function(t) { return comparing.includes(t.id); });
  var priceArr = filtered.length > 0 ? filtered.map(function(t){ return t.price; }) : [0];
  var minPrice = Math.min.apply(null, priceArr);

  function brandColor(b) { return BRAND_COLORS[b] || "#64748B"; }

  var activeCount = brandFilters.size + featureFilters.size + (sizeFilter !== "すべて" ? 1 : 0);

    <div style={{ minHeight: "100vh", background: "#F1F5F9", fontFamily: "Hiragino Sans", color: "#1E293B" }}>

      {/* ── Header ── */}
      <div style={{ background: "linear-gradient(135deg, #0F2545 0%, #1E3A5F 100%)", padding: "16px 18px 14px", color: "#fff" }}>
        <div style={{ maxWidth: "1020px", margin: "0 auto" }}>
          <div style={{ display: "flex", alignItems: "center", gap: "10px", marginBottom: "4px" }}>
            <span style={{ fontSize: "22px" }}>🏪</span>
            <div>
              <div style={{ fontSize: "18px", fontWeight: "800" }}>テレビ 選び方ガイド</div>
              <div style={{ fontSize: "11px", color: "rgba(255,255,255,0.5)" }}>ビックカメラ川崎店 ／ 2026年5月 ／ 32型7機種 + 43型14機種</div>
            </div>
          </div>
          <div style={{ background: "rgba(255,255,255,0.1)", borderRadius: "8px", padding: "8px 12px", fontSize: "11px", color: "rgba(255,255,255,0.8)", marginTop: "8px", borderLeft: "3px solid #FBBF24" }}>
            💬 <strong>スタッフより：</strong>メーカー・機能は複数選択できます。「＋比較」で最大3機種を横並び比較できます！
          </div>

                        <td style={{ padding: "10px 18px", color: "#64748B", fontSize: "11px", fontWeight: "600", borderRight: "1px solid #F1F5F9" }}>{row.l}</td>
                        {compareList.map(function(tv) {
                          var isBest = row.bestFn(compareList).includes(tv.id);
                          var val = row.fn(tv);
                          return (
                            <td key={tv.id} style={{ padding: "10px 14px", textAlign: "center", borderLeft: "1px solid #F1F5F9", background: isBest?"#F0FDF4":"transparent" }}>
                              <span style={{ fontSize: "15px", color: val==="✓"?"#059669":"#CBD5E1", fontWeight: "800" }}>{val}</span>
                            </td>
                          );
                        })}
                      </tr>
                    ); })}

                    {/* 音響・その他機能 */}
                    <tr style={{ background: "#FEF2F2" }}>
                      <td colSpan={compareList.length + 1} style={{ padding: "5px 18px", fontSize: "10px", fontWeight: "800", color: "#991B1B" }}>🔊 音響・その他機能</td>
                    </tr>
                    {[
                      { l: "スピーカー", fn: function(tv) { return tv.specs.speaker || "—"; }, bestFn: bestSpeaker },
                      { l: "2画面表示", fn: function(tv) { return tv.twoScreen ? "✓" : "—"; }, bool: true, bestFn: function(arr) { return arr.filter(function(t) { return t.twoScreen; }).map(function(t) { return t.id; }); } },
                      { l: "BD内蔵", fn: function(tv) { return tv.bdDrive ? "✓" : "—"; }, bool: true, bestFn: function(arr) { return arr.filter(function(t) { return t.bdDrive; }).map(function(t) { return t.id; }); } }
                    ].map(function(row, ri) { return (
                      <tr key={row.l} style={{ background: ri%2===0?"#fff":"#FFF5F5", borderBottom: "1px solid #F1F5F9" }}>
                        <td style={{ padding: "10px 18px", color: "#64748B", fontSize: "11px", fontWeight: "600", borderRight: "1px solid #F1F5F9" }}>{row.l}</td>
                        {compareList.map(function(tv) {
                          var best = row.bestFn ? row.bestFn(compareList) : [];
                          var isBest = best.includes(tv.id);
                          var val = row.fn(tv);
                          return (
                            <td key={tv.id} style={{ padding: "10px 14px", textAlign: "center", borderLeft: "1px solid #F1F5F9", background: isBest?"#FEF2F2":"transparent" }}>
                              <span style={{ fontWeight: isBest?"800":"400", color: row.bool?(val==="✓"?"#059669":"#CBD5E1"):isBest?"#991B1B":"#334155", fontSize: "12px" }}>{val}</span>
                              {isBest && !row.bool && <div style={{ fontSize: "9px", color: "#991B1B", fontWeight: "700" }}>◀ 最大</div>}
                            </td>
                          );
                        })}
                      </tr>
                    ); })}

                    {/* 省エネ */}
                    <tr style={{ background: "#ECFDF5" }}>
                      <td colSpan={compareList.length + 1} style={{ padding: "5px 18px", fontSize: "10px", fontWeight: "800", color: "#065F46" }}>🌿 省エネ</td>
                    </tr>
                    {[
                      { l: "省エネ評価", fn: function(tv) { return tv.specs.ecoStar > 0 ? tv.specs.ecoStar + " / 5.0" : "—"; }, bestFn: bestEco },
                      { l: "年間電気代", fn: function(tv) { return tv.specs.annualCost !== "—" ? tv.specs.annualCost : "—"; }, bestFn: bestAnnualCost }
                    ].map(function(row, ri) { return (
                      <tr key={row.l} style={{ background: ri%2===0?"#fff":"#F0FDF9", borderBottom: "1px solid #F1F5F9" }}>
                        <td style={{ padding: "10px 18px", color: "#64748B", fontSize: "11px", fontWeight: "600", borderRight: "1px solid #F1F5F9" }}>{row.l}</td>
                        {compareList.map(function(tv) {
                          var best = row.bestFn(compareList);
                          var isBest = best.includes(tv.id);
                          return (
                            <td key={tv.id} style={{ padding: "10px 14px", textAlign: "center", borderLeft: "1px solid #F1F5F9", background: isBest?"#ECFDF5":"transparent" }}>
                              <span style={{ fontWeight: isBest?"800":"400", color: isBest?"#065F46":"#334155", fontSize: "12px" }}>{row.fn(tv)}</span>
                              {isBest && <div style={{ fontSize: "9px", color: "#059669", fontWeight: "700" }}>◀ 優秀</div>}
                            </td>
                          );
                        })}
                      </tr>
                    ); })}

                    {/* 録画・配信 */}
                    <tr style={{ background: "#F0FDF4" }}>
                      <td colSpan={compareList.length + 1} style={{ padding: "5px 18px", fontSize: "10px", fontWeight: "800", color: "#166534" }}>📼 録画・配信</td>
                    </tr>
                    {[
                      { l: "録画機能", fn: function(tv) { return tv.recording.detail; } },
                      { l: "タイムシフト録画", fn: function(tv) { return tv.recording.timeshift ? "✓ 対応" : "—"; }, bool: true, bestFn: function(arr) { return arr.filter(function(t) { return t.recording.timeshift; }).map(function(t) { return t.id; }); } },
                      { l: "裏番組録画", fn: function(tv) { return tv.recording.simultaneous ? "✓ 対応" : "—"; }, bool: true, bestFn: function(arr) { return arr.filter(function(t) { return t.recording.simultaneous; }).map(function(t) { return t.id; }); } },
                      { l: "対応配信数", fn: function(tv) { return tv.streaming.length > 0 ? tv.streaming.length + "サービス" : "非対応"; }, bestFn: function(arr) { var mx = arr.reduce(function(m,t) { return t.streaming.length > m ? t.streaming.length : m; }, 0); if(mx===0) return []; return arr.filter(function(t) { return t.streaming.length === mx; }).map(function(t) { return t.id; }); } },
                      { l: "対応配信サービス", fn: function(tv) { return tv.streaming.length > 0 ? tv.streaming.join(" / ") : "—"; } }
                    ].map(function(row, ri) { return (
                      <tr key={row.l} style={{ background: ri%2===0?"#fff":"#F9FEF9", borderBottom: "1px solid #F1F5F9" }}>
                        <td style={{ padding: "10px 18px", color: "#64748B", fontSize: "11px", fontWeight: "600", borderRight: "1px solid #F1F5F9", whiteSpace: "nowrap" }}>{row.l}</td>
                        {compareList.map(function(tv) {
                          var best = row.bestFn ? row.bestFn(compareList) : [];
                          var isBest = best.includes(tv.id);
                          var val = row.fn(tv);
                          return (
                            <td key={tv.id} style={{ padding: "10px 14px", textAlign: "center", borderLeft: "1px solid #F1F5F9", background: isBest?"#F0FDF4":"transparent" }}>
                              <span style={{ fontWeight: isBest?"800":"400", fontSize: "11px", color: row.bool?(val.includes("✓")?"#059669":"#CBD5E1"):isBest?"#166534":"#334155" }}>{val}</span>
                              {isBest && !row.bool && <div style={{ fontSize: "9px", color: "#166534", fontWeight: "700" }}>◀ 最多</div>}
                            </td>
                          );
                        })}
                      </tr>
                    ); })}

                    {/* スタッフ */}
                    <tr style={{ background: "#EFF6FF" }}>
                      <td colSpan={compareList.length + 1} style={{ padding: "5px 18px", fontSize: "10px", fontWeight: "800", color: "#1E40AF" }}>💬 スタッフコメント</td>
                    </tr>
                    <tr style={{ background: "#fff" }}>
                      <td style={{ padding: "10px 18px", color: "#64748B", fontSize: "11px", fontWeight: "600", borderRight: "1px solid #F1F5F9", verticalAlign: "top" }}>特徴</td>
                      {compareList.map(function(tv) { return (
                        <td key={tv.id} style={{ padding: "10px 14px", borderLeft: "1px solid #F1F5F9", verticalAlign: "top" }}>
                          <div style={{ fontSize: "11px", color: "#374151", lineHeight: "1.6" }}>{tv.staffComment}</div>
                        </td>
                      ); })}
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>

            {/* Modal footer */}
            <div style={{ padding: "11px 20px", borderTop: "1px solid #E2E8F0", background: "#F8FAFC", display: "flex", justifyContent: "space-between", alignItems: "center", flexShrink: 0 }}>
              <button onClick={function(){ setComparing([]); setShowModal(false); }} style={{ background: "none", border: "1.5px solid #CBD5E1", color: "#64748B", padding: "7px 15px", borderRadius: "7px", cursor: "pointer", fontSize: "12px", fontWeight: "700" }}>選択をクリア</button>
              <button onClick={function(){ setShowModal(false); }} style={{ background: "#1D4ED8", border: "none", color: "#fff", padding: "7px 20px", borderRadius: "7px", cursor: "pointer", fontSize: "12px", fontWeight: "800" }}>閉じる</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(TVGuide));
  </script>
</body>
</html>
